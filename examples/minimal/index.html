<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <label>Note <input id="note" autocomplete="off" /></label>
      <!-- An icon button: its name comes from aria-label alone, so removing it is an a11y fault. -->
      <button id="clear" type="button" aria-label="Clear note">
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" /></svg>
      </button>
      <button id="save" type="button">Save</button>
      <button id="archive" type="button" disabled>Archive</button>
      <button id="delete" type="button">Delete…</button>
      <label>Import <input id="import" type="file" accept="application/json" /></label>
      <p>Saved: <output id="saved">(nothing saved)</output></p>
      <p id="status" role="status"></p>
      <button id="break" type="button">Break</button>
      <div id="update" role="alert" hidden>
        A new version is ready.
        <button id="update-reload" type="button">Reload</button>
        <button id="update-later" type="button">Later</button>
      </div>
    </main>
    <dialog id="confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title">Delete the note?</h2>
      <button id="confirm-cancel" type="button">Cancel</button>
      <button id="confirm-delete" type="button">Delete</button>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
