name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A local action loads from the checkout, so check out first and tell setup not to again.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          checkout: 'false'
      - run: pnpm check

  # The composite actions are part of the product: run them the way consumers do.
  actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/scope
        with:
          skip: '^(README\.md|ROADMAP\.md|docs/.+\.md|LICENSE)$'
      - run: test -n "$CODE"
        env:
          CODE: ${{ steps.scope.outputs.code }}

  # Real sessions, smoke and container E2E against examples/minimal, through a packed install:
  # the only proof that start/run/restart/reset/stop and the ownership refusals work end to end.
  acceptance:
    needs: actions
    if: needs.actions.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WEB_HARNESS_ACCEPTANCE_DIR: ${{ runner.temp }}/acceptance
      WEB_HARNESS_ACCEPTANCE_KEEP: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 24
          browsers: chromium
          checkout: 'false'
      - name: Pull the Playwright image matched to this version
        run: docker pull "mcr.microsoft.com/playwright:v$(node -p "require('playwright/package.json').version")-noble"
      - run: pnpm test:acceptance
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-evidence
          path: |
            ${{ runner.temp }}/acceptance/*/.web-harness/
            ${{ runner.temp }}/acceptance/*/playwright-report/
          if-no-files-found: ignore
          include-hidden-files: true

  verdict:
    needs: [test, actions, acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/verdict
        with:
          needs: ${{ toJSON(needs) }}
          code: ${{ needs.actions.outputs.code }}
          required: test acceptance
