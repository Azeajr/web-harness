name: Release tag

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable semantic version');
            const tag = `v${version}`;
            const repo = context.repo;
            const sha = context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100,
            });
            if (!runs.some(run => run.head_branch === 'main' && run.status === 'completed' && run.conclusion === 'success')) {
              throw new Error(`Successful main CI required for ${sha}`);
            }
            try {
              const existing = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              if (existing.data.object.type !== 'commit' || existing.data.object.sha !== sha) {
                throw new Error(`${tag} already exists at a different object; refusing to move it`);
              }
              core.notice(`${tag} already points to ${sha}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha });
            core.notice(`Created ${tag} at ${sha}`);
