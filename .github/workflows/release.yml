name: Release tag

# Runs by itself after every successful push CI on main, and tags the commit when package.json
# carries a version that has no tag yet. Ordinary commits find their version already tagged and
# do nothing. workflow_dispatch remains for retrying by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable semantic version');
            const tag = `v${version}`;
            const repo = context.repo;
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            const automatic = context.eventName === 'workflow_run';
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100,
            });
            if (!runs.some(run => run.head_branch === 'main' && run.status === 'completed' && run.conclusion === 'success')) {
              throw new Error(`Successful main CI required for ${sha}`);
            }
            try {
              const existing = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              if (existing.data.object.type !== 'commit' || existing.data.object.sha !== sha) {
                if (automatic) {
                  core.notice(`${tag} is already released; bump package.json to release this commit`);
                  return;
                }
                throw new Error(`${tag} already exists at a different object; refusing to move it`);
              }
              core.notice(`${tag} already points to ${sha}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha });
            core.notice(`Created ${tag} at ${sha}`);
